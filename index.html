<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Compare rótulos nutricionais com inteligência artificial e descubra qual produto é melhor para o seu objetivo." />
  <!-- Cream theme color (light default — no dark flash) -->
  <meta name="theme-color" content="#FFFBEF" />
  <title>NutriCompare — Comparador Nutricional</title>

  <!-- Tailwind CSS CDN with JIT -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            /* Archivo (regular weight) for body text */
            sans: ['Archivo', 'sans-serif'],
            /* Space Mono for data / labels / buttons */
            mono: ['"Space Mono"', 'monospace'],
            /* Archivo Black for display / headlines / giant numbers */
            display: ['"Archivo Black"', 'sans-serif'],
          },
          colors: {
            'nc-lime':   '#C6F833',
            'nc-pink':   '#FF7DE3',
            'nc-blue':   '#2B4BF2',
            'nc-yellow': '#FFD23F',
            'nc-red':    '#FF5A47',
            'nc-cream':  '#FFFBEF',
          },
        }
      }
    }
  </script>

  <!-- Fonts: Archivo Black (display/numbers) + Archivo (body) + Space Mono (data) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet"
  />

  <style>
    /* Fallback font assignments before Tailwind config loads */
    body        { font-family: 'Archivo', sans-serif; }
    .font-mono  { font-family: 'Space Mono', monospace; }
    .font-display { font-family: 'Archivo Black', sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
