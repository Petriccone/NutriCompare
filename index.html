<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <meta name="theme-color" content="#6366f1" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#08090f"  media="(prefers-color-scheme: dark)" />
  <title>NutriCompare — Comparador Nutricional</title>

  <!-- Tailwind CSS CDN (includes JIT engine) -->

  />

  <style>
    body      { font-family: 'Inter', sans-serif; }

  </style>
